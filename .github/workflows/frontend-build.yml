name: Frontend build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/generate_frontend_data.py'
      - 'db/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/generate_frontend_data.py'
      - 'db/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build generated Astro site
        run: npm run build
