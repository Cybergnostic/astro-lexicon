name: Lexicographic triage

on:
  workflow_dispatch:
  push:
    paths:
      - 'db/**'
      - 'scripts/lexicographic_triage.py'
      - 'scripts/test_lexicographic_triage.py'
      - 'scripts/export_editorial_packets.py'
      - 'docs/editorial/lexicographic-pilot-slugs.txt'
      - 'docs/editorial/batch-02-lots-slugs.txt'
      - 'docs/editorial/lexicographic-ledger.csv'
      - '.github/workflows/lexicographic-triage.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'scripts/lexicographic_triage.py'
      - 'scripts/test_lexicographic_triage.py'
      - 'docs/editorial/lexicographic-ledger.csv'
      - '.github/workflows/lexicographic-triage.yml'

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate triage heuristics and approval gate
        run: python3 -m unittest discover -s scripts -p 'test_lexicographic_triage.py' -v
      - name: Rebuild corpus and audit all public headwords
        run: |
          python3 scripts/lexicographic_triage.py \
            --out .tmp/lexicographic-triage.csv \
            --focus reception,essential-dignity,application,translation-of-light,sect,fardar,annual-profection,animodar,lot-of-fortune,saturn
      - name: Export actual ten-entry pilot for editorial comparison
        run: |
          python3 scripts/export_editorial_packets.py \
            --db .tmp/lexicographic-triage.sqlite \
            --slugs-file docs/editorial/lexicographic-pilot-slugs.txt \
            --out .tmp/pilot-review-packet.md
      - name: Export next 20-entry Lots batch with current source locators
        run: |
          python3 scripts/export_editorial_packets.py \
            --db .tmp/lexicographic-triage.sqlite \
            --slugs-file docs/editorial/batch-02-lots-slugs.txt \
            --out .tmp/lots-review-packet.md
      - name: Publish candidate inventory and editorial packets
        uses: actions/upload-artifact@v4
        with:
          name: lexicographic-candidate-inventory
          path: |
            .tmp/lexicographic-triage.csv
            .tmp/pilot-review-packet.md
            .tmp/lots-review-packet.md
          retention-days: 30
